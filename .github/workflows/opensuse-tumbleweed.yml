          sudo mount --bind /dev $GITHUB_WORKSPACE/opensuse/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/opensuse/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/opensuse/sys
          sudo chroot $GITHUB_WORKSPACE/opensuse /bin/sh -c "zypper -n dup && zypper -n in wget && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/opensuse/lxde/install-lxde.sh && sh install-lxde.sh && rm install-lxde.sh"
          sudo umount -l $GITHUB_WORKSPACE/opensuse/dev
          sudo umount -l $GITHUB_WORKSPACE/opensuse/proc
          sudo umount -l $GITHUB_WORKSPACE/opensuse/sys
          sudo tar --exclude=dev/* -cf - opensuse | xz -9 -T0 -c > opensuse-tumbleweed-lxde-aarch64.tar.xz
          sudo rm -r opensuse
          
