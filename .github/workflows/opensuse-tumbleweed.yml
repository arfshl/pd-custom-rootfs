name: "OpenSUSE Tumbleweed"

on:
  schedule:
# Build Every Week
    - cron: "0 0 * * 0"
  push:
    branches: [ 'main' ]
    paths:
      - ".github/workflows/opensuse-tumbleweed.yml"
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        arch: [aarch64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Start Build!
        run: |
              ARCH=${{ matrix.arch }}
              case "$ARCH" in
              aarch64)
              ARCH="arm64"
              ;;
              esac
              # Fetch image manifest
              opensuse_manifest=$(docker manifest inspect opensuse/tumbleweed:latest)
              # Fetch image digest
              arch="$ARCH"
              digest=$(echo "$opensuse_manifest" | jq -r ".manifests[] | select(.platform.architecture == \"$arch\") | .digest")
              # Pull and Export image
              mkdir --parent --mode 755 $GITHUB_WORKSPACE/opensuse-dump/opensuse
              TARGET_DIR="$GITHUB_WORKSPACE/opensuse-dump/opensuse"
              docker pull "opensuse/tumbleweed@${digest}"
              docker export --output "$GITHUB_WORKSPACE/opensuse-dump/opensuse-dump-arm64.tar" \
              $(docker create "opensuse/tumbleweed@${digest}")
              tar -xpf "$GITHUB_WORKSPACE/opensuse-dump/opensuse-dump-arm64.tar" -C "$TARGET_DIR"
              # Modification so rootfs can run in proot-distro
              cat <<- EOF | sudo unshare -mpf bash -e -
              rm -f "${TARGET_DIR}/etc/resolv.conf"
              echo "nameserver 1.1.1.1" > "${TARGET_DIR}/etc/resolv.conf"
              #sed -i -E 's/^(rpm\.install\.excludedocs)/# \1/g' "${TARGET_DIR}/etc/zypp/zypp.conf"
              mount --bind /dev "${TARGET_DIR}/dev"
              mount --bind /proc "${TARGET_DIR}/proc"
              mount --bind /sys "${TARGET_DIR}/sys"
              #chroot "${TARGET_DIR}" zypper removerepo repo-openh264 || true
              chroot "${TARGET_DIR}" zypper refresh
              chroot "${TARGET_DIR}" zypper dup --no-confirm
              chroot "${TARGET_DIR}" rpm -qa --qf '%{NAME} ' | xargs -n 1 | grep -Pv '(filesystem|gpg-pubkey)' > /tmp/opensuse-pkgs.txt
              cat /tmp/opensuse-pkgs.txt | xargs chroot "${TARGET_DIR}" zypper install --no-confirm --force
              chroot "${TARGET_DIR}" zypper install --no-confirm util-linux
              umount "${TARGET_DIR}/dev"
              umount "${TARGET_DIR}/proc"
              umount "${TARGET_DIR}/sys"
              EOF
              sudo rm -f /tmp/opensuse-pkgs.txt
              # Make rootfs archive
              cd $GITHUB_WORKSPACE/opensuse-dump
              sudo tar --exclude=dev/* -cpf - opensuse | xz -9 -T0 -c > $GITHUB_WORKSPACE/opensuse-tumbleweed-${{ matrix.arch }}.tar.xz

      - name: Build XFCE
        run: |
          tar -xpJf opensuse-tumbleweed-${{ matrix.arch }}.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/dev
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/proc
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/sys
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/opensuse
          sudo chmod -R 1777 $GITHUB_WORKSPACE/opensuse/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/opensuse/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/opensuse/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/opensuse/sys
          sudo chroot $GITHUB_WORKSPACE/opensuse /bin/sh -c "zypper -n dup && zypper -n in wget && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/opensuse/xfce/install-xfce.sh && sh install-xfce.sh && rm install-xfce.sh"
          sudo umount -l $GITHUB_WORKSPACE/opensuse/dev
          sudo umount -l $GITHUB_WORKSPACE/opensuse/proc
          sudo umount -l $GITHUB_WORKSPACE/opensuse/sys
          sudo tar --exclude=dev/* -cpf - opensuse | xz -9 -T0 -c > opensuse-tumbleweed-xfce-${{ matrix.arch }}.tar.xz
          sudo rm -r opensuse
          
      - name: Build lxqt
        run: |
          tar -xpJf opensuse-tumbleweed-${{ matrix.arch }}.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/dev
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/proc
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/sys
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/opensuse
          sudo chmod -R 1777 $GITHUB_WORKSPACE/opensuse/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/opensuse/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/opensuse/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/opensuse/sys
          sudo chroot $GITHUB_WORKSPACE/opensuse /bin/sh -c "zypper -n dup && zypper -n in wget && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/opensuse/lxqt/install-lxqt.sh && sh install-lxqt.sh && rm install-lxqt.sh"
          sudo umount -l $GITHUB_WORKSPACE/opensuse/dev
          sudo umount -l $GITHUB_WORKSPACE/opensuse/proc
