          sudo chmod -R 755 $GITHUB_WORKSPACE/opensuse
          sudo chmod -R 1777 $GITHUB_WORKSPACE/opensuse/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/opensuse/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/opensuse/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/opensuse/sys
          sudo chroot $GITHUB_WORKSPACE/opensuse /bin/sh -c "zypper -n dup && zypper -n in wget && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/opensuse/lxqt/install-lxqt.sh && sh install-lxqt.sh && rm install-lxqt.sh"
