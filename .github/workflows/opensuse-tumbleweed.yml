          sudo rm -r opensuse
          
                    
      - name: Push to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opensuse-tumbleweed
          name: OpenSUSE Tumbleweed (Rolling Release)
          files: |
            opensuse-tumbleweed-aarch64.tar.xz
            opensuse-tumbleweed-*-aarch64.tar.xz
          preserve_order: true
          make_latest: false
          
env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      











