          sudo chroot $GITHUB_WORKSPACE/opensuse /bin/sh -c "zypper -n dup && zypper -n in wget && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/opensuse/kde/install-kde.sh && sh install-kde.sh && rm install-kde.sh"
          sudo umount -l $GITHUB_WORKSPACE/opensuse/dev
          sudo umount -l $GITHUB_WORKSPACE/opensuse/proc
          sudo umount -l $GITHUB_WORKSPACE/opensuse/sys
          sudo tar --exclude=dev/* -cf - opensuse | xz -9 -T0 -c > opensuse-tumbleweed-kde-aarch64.tar.xz
          sudo rm -r opensuse
          
      - name: Build cinnamon
        run: |
          tar -xJf opensuse-tumbleweed-aarch64.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/dev
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/proc
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/sys
          sudo mkdir -p $GITHUB_WORKSPACE/opensuse/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/opensuse
          sudo chmod -R 1777 $GITHUB_WORKSPACE/opensuse/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/opensuse/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/opensuse/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/opensuse/sys
          sudo chroot $GITHUB_WORKSPACE/opensuse /bin/sh -c "zypper -n dup && zypper -n in wget && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/opensuse/cinnamon/install-cinnamon.sh && sh install-cinnamon.sh && rm install-cinnamon.sh"
          sudo umount -l $GITHUB_WORKSPACE/opensuse/dev
