name: "Ubuntu LTS"

on:
  schedule:
# Build Every Months
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Needed Dependencies
        run: |
          sudo apt update && sudo apt install -yq curl xz-utils
          curl -L -o /tmp/mmdebstrap.deb http://ftp.us.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_1.5.7-3_all.deb
          sudo apt install -yq /tmp/mmdebstrap.deb
          curl -L -o /tmp/keyring.deb http://ftp.us.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          sudo apt install -yq /tmp/keyring.deb
      - name: Start Building
        run: |
          dist_version="noble"
          sudo mmdebstrap --arch=arm64 \
          --variant=apt \
          --components="main,universe,multiverse" \
          --include=locales,passwd,software-properties-common,ca-certificates \
          --format=tar \
          ${dist_version} \
          - \
          http://ports.ubuntu.com/ubuntu-ports \
          | xz -9 -T0 -c > ubuntu-lts-${dist_version}-aarch64.tar.xz
          cp ubuntu-lts-${dist_version}-aarch64.tar.xz ubuntu-lts-aarch64.tar.xz

          tar --exclude=dev/* -xJf ubuntu-lts-aarch64.tar.xz
          cat <<- EOF | sudo unshare -mpf bash -e -
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu-lts-aarch64/./dev
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu-lts-aarch64/./proc
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu-lts-aarch64/./sys
          sudo mount --bind /dev $GITHUB_WORKSPACE/ubuntu-lts-aarch64/./dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/ubuntu-lts-aarch64/./proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/ubuntu-lts-aarch64/./sys
          sudo chroot $GITHUB_WORKSPACE/ubuntu-lts-aarch64/. apt update && apt install wget -y && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/ubuntu/xfce/install.sh && sh install.sh && rm install.sh
          sudo umount -l $GITHUB_WORKSPACE/ubuntu-lts-aarch64/./dev
          sudo umount -l $GITHUB_WORKSPACE/ubuntu-lts-aarch64/./proc
          sudo umount -l $GITHUB_WORKSPACE/ubuntu-lts-aarch64/./sys
          EOF
          tar --exclude=dev/* -cvf - ubuntu-lts-aarch64/ | xz -9 -T0 -c > ubuntu-lts-xfce-aarch64.tar.xz
          cp ubuntu-lts-xfce-aarch64.tar.xz ubuntu-lts-${dist_version}-xfce-aarch64.tar.xz
          
      - name: Push to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-lts
          name: Ubuntu LTS
          files: |
            ubuntu-lts-aarch64.tar.xz
            ubuntu-lts-*-aarch64.tar.xz
          preserve_order: true
          make_latest: false
