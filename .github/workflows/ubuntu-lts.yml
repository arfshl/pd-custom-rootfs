name: "Ubuntu LTS"

on:
  schedule:
# Build Every Week
    - cron: "0 0 * * 0"
  push:
    branches: [ 'main' ]
    paths:
      - ".github/workflows/ubuntu-lts.yml"
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build-arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        arch: [arm64, armhf]
        release: [ resolute ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Needed Dependencies
        run: |
          curl -L -o /tmp/mmdebstrap.deb http://ftp.us.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_1.5.7-3_all.deb
          sudo apt install -yq /tmp/mmdebstrap.deb
          curl -L -o /tmp/keyring.deb http://ftp.us.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          sudo apt install -yq /tmp/keyring.deb
          sudo dpkg --add-architecture armhf
          sudo apt update
          sudo apt install -y libc6:armhf
      - name: Start Building
        run: |
          dist_version="${{ matrix.release }}"
          mkdir -p $GITHUB_WORKSPACE/ubuntu-lts-${dist_version}-${{ matrix.arch }}
          sudo mmdebstrap \
          --arch="${{ matrix.arch }}" \
          --variant=apt \
          --components="main,universe,multiverse" \
          --include=locales,passwd,software-properties-common,ca-certificates \
          --format=directory \
          ${dist_version} \
          ubuntu \
          http://ports.ubuntu.com/ubuntu-ports

          cat <<- EOF | sudo unshare -mpf bash -e -
          sudo mount --bind /dev $GITHUB_WORKSPACE/ubuntu/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/ubuntu/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/ubuntu/sys
          sudo chroot $GITHUB_WORKSPACE/ubuntu apt update
          sudo chroot $GITHUB_WORKSPACE/ubuntu apt purge -yq --allow-remove-essential coreutils-from-uutils
          sudo chroot $GITHUB_WORKSPACE/ubuntu apt purge -yq --allow-remove-essential rust-coreutils
          sudo chroot $GITHUB_WORKSPACE/ubuntu apt install -yq coreutils-from-gnu
          sudo chroot $GITHUB_WORKSPACE/ubuntu apt install -yq gnu-coreutils
          sudo chroot $GITHUB_WORKSPACE/ubuntu apt clean
          sudo rm -rf $GITHUB_WORKSPACE/ubuntu/var/lib/apt/lists/*
          EOF
          sudo tar --exclude=dev/* -cpf - ubuntu | xz -9 -T0 -c > ubuntu-lts-${{ matrix.arch }}.tar.xz
          rm -r ubuntu

      - name: Build XFCE
        run: |
          tar -xJpf ubuntu-lts-${{ matrix.arch }}.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/dev
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/proc
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/sys
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/ubuntu
          sudo chmod -R 1777 $GITHUB_WORKSPACE/ubuntu/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/ubuntu/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/ubuntu/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/ubuntu/sys
          sudo chroot $GITHUB_WORKSPACE/ubuntu /bin/sh -c "apt update && apt install wget -y && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/ubuntu/xfce/install.sh && sh install.sh && rm install.sh"
          sudo umount -l $GITHUB_WORKSPACE/ubuntu/dev
          sudo umount -l $GITHUB_WORKSPACE/ubuntu/proc
          sudo umount -l $GITHUB_WORKSPACE/ubuntu/sys
          sudo tar --exclude=dev/* -cf - ubuntu | xz -9 -T0 -c > ubuntu-lts-xfce-${{ matrix.arch }}.tar.xz
          sudo rm -r ubuntu

      - name: Build MATE
        run: |
          tar -xJpf ubuntu-lts-${{ matrix.arch }}.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/dev
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/proc
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/sys
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/ubuntu
          sudo chmod -R 1777 $GITHUB_WORKSPACE/ubuntu/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/ubuntu/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/ubuntu/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/ubuntu/sys
          sudo chroot $GITHUB_WORKSPACE/ubuntu /bin/sh -c "apt update && apt install wget -y && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/ubuntu/mate/install.sh && sh install.sh && rm install.sh"
          sudo umount -l $GITHUB_WORKSPACE/ubuntu/dev
          sudo umount -l $GITHUB_WORKSPACE/ubuntu/proc
          sudo umount -l $GITHUB_WORKSPACE/ubuntu/sys
          sudo tar --exclude=dev/* -cf - ubuntu | xz -9 -T0 -c > ubuntu-lts-mate-${{ matrix.arch }}.tar.xz
          sudo rm -r ubuntu
          
      - name: Build LXQt
        run: |
          tar -xJpf ubuntu-lts-${{ matrix.arch }}.tar.xz
