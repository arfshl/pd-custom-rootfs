          sudo rm -r ubuntu
          
      - name: Build KDE
        run: |
          tar -xJpf ubuntu-lts-${{ matrix.arch }}.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/dev
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/proc
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/sys
          sudo mkdir -p $GITHUB_WORKSPACE/ubuntu/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/ubuntu
          sudo chmod -R 1777 $GITHUB_WORKSPACE/ubuntu/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/ubuntu/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/ubuntu/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/ubuntu/sys
          sudo chroot $GITHUB_WORKSPACE/ubuntu /bin/sh -c "apt update && apt install wget -y && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/ubuntu/kde/install.sh && sh install.sh && rm install.sh"
          sudo umount -l $GITHUB_WORKSPACE/ubuntu/dev
          sudo umount -l $GITHUB_WORKSPACE/ubuntu/proc
          sudo umount -l $GITHUB_WORKSPACE/ubuntu/sys
          sudo tar --exclude=dev/* -cf - ubuntu | xz -9 -T0 -c > ubuntu-lts-kde-${{ matrix.arch }}.tar.xz
          sudo rm -r ubuntu

      - name: Deploy to proot-distro-desktop
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-lts
          name: Ubuntu LTS
          files: |
            ubuntu-lts-${{ matrix.arch }}.tar.xz
            ubuntu-lts-*-${{ matrix.arch }}.tar.xz
          preserve_order: true
          make_latest: true

