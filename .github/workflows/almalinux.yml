name: "AlmaLinux"

on:
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Start Building
        run: |
          dist_version="10"
          sudo rm -f $GITHUB_WORKSPACE/rootfs/almalinux-*.tar.xz
          mkdir -p $GITHUB_WORKSPACE/rootfs
          curl --fail --location --output "$GITHUB_WORKSPACE/rootfs/almalinux-aarch64.tar.xz" "https://github.com/AlmaLinux/container-images/raw/refs/heads/${dist_version}/default/arm64/almalinux-${dist_version}-default-arm64.tar.xz"
          mkdir -p $GITHUB_WORKSPACE/rootfs/almalinux-aarch64
          tar -xJf $GITHUB_WORKSPACE/rootfs/almalinux-aarch64.tar.xz -C $GITHUB_WORKSPACE/rootfs/almalinux-aarch64
          rm $GITHUB_WORKSPACE/rootfs/almalinux-aarch64.tar.xz
          cd $GITHUB_WORKSPACE/rootfs
          sudo tar -cJf $GITHUB_WORKSPACE/rootfs/almalinux-aarch64.tar.xz almalinux-aarch64
          cp almalinux-aarch64.tar.xz  almalinux-${dist_version}-aarch64.tar.xz
      - name: Push to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: almalinux
          name: AlmaLinux (Based on RHEL)
          files: |
             rootfs/almalinux*aarch64.tar.xz
          preserve_order: true
          make_latest: false
env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}