name: "Ubuntu LTS next"

on:
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Needed Dependencies
        run: |
          sudo apt update && sudo apt install -yq curl jq binfmt-support xz-utils
          curl -L -o /tmp/mmdebstrap.deb http://ftp.us.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_1.5.7-3_all.deb
          sudo apt install -yq /tmp/mmdebstrap.deb
          curl -L -o /tmp/keyring.deb http://ftp.us.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          sudo apt install -yq /tmp/keyring.deb
      - name: Start Building
        run: |
          mkdir -p $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64
          sudo mmdebstrap \
          --arch=arm64 \
          --variant=apt \
          --components="main,universe,multiverse" \
          --include=locales,passwd,software-properties-common,ca-certificates \
          --format=directory \
          resolute \
          $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64 \
          http://ports.ubuntu.com/ubuntu-ports

          cat <<- EOF | sudo unshare -mpf bash -e -
          sudo mount --bind /dev $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64/sys
          sudo chroot $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64 apt update
          sudo chroot $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64 apt purge -yq --allow-remove-essential coreutils-from-uutils
          sudo chroot $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64 apt purge -yq --allow-remove-essential rust-coreutils
          sudo chroot $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64 apt install -yq coreutils-from-gnu
          sudo chroot $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64 apt install -yq gnu-coreutils
          sudo chroot $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64 apt clean
          sudo rm -rf $GITHUB_WORKSPACE/ubuntu-lts-26.04-arm64/var/lib/apt/lists/*
          EOF
          tar -cvf - ubuntu-lts-26.04-arm64/ | xz -9 -T0 -c > ubuntu-lts-26.04-arm64.tar.xz
          
      - name: Push to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-lts-26.04
          name: Ubuntu LTS 26.04 (Resolute Racoon) daily build
          files: |
             ubuntu-lts-26.04-arm64.tar.xz
          preserve_order: true
          make_latest: false
   

env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
