          sudo mkdir -p $GITHUB_WORKSPACE/debian/sys
          sudo mkdir -p $GITHUB_WORKSPACE/debian/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/debian
          sudo chmod -R 1777 $GITHUB_WORKSPACE/debian/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/debian/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/debian/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/debian/sys
          sudo chroot $GITHUB_WORKSPACE/debian /bin/sh -c "apt update && apt install wget -y && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/debian/kde/install.sh && sh install.sh && rm install.sh"
          sudo umount -l $GITHUB_WORKSPACE/debian/dev
          sudo umount -l $GITHUB_WORKSPACE/debian/proc
          sudo umount -l $GITHUB_WORKSPACE/debian/sys
          sudo tar --exclude=dev/* -cf - debian | xz -9 -T0 -c > debian-stable-kde-${{ matrix.arch }}.tar.xz
          sudo rm -r debian
          
      - name: Deploy to proot-distro-desktop
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debian-stable
          name: Debian Stable
          files: |
            debian-stable-${{ matrix.arch }}.tar.xz
            debian-stable-*-${{ matrix.arch }}.tar.xz
          preserve_order: true
          make_latest: true
          fail_on_unmatched_files: false
