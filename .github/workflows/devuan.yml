          sudo mkdir -p $GITHUB_WORKSPACE/devuan/dev
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/proc
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/sys
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/devuan
          sudo chmod -R 1777 $GITHUB_WORKSPACE/devuan/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/devuan/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/devuan/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/devuan/sys
          sudo chroot $GITHUB_WORKSPACE/devuan /bin/sh -c "apt update && apt install wget -y && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/devuan/lxde/install.sh && sh install.sh && rm install.sh"
          sudo umount -l $GITHUB_WORKSPACE/devuan/dev
          sudo umount -l $GITHUB_WORKSPACE/devuan/proc
          sudo umount -l $GITHUB_WORKSPACE/devuan/sys
          sudo tar --exclude=dev/* -cf - devuan | xz -9 -T0 -c > devuan-stable-lxde-aarch64.tar.xz
          sudo rm -r devuan
          
      - name: Build Cinnamon
        run: |
          tar -xJf devuan-stable-aarch64.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/dev
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/proc
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/sys
