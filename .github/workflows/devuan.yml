name: "Devuan Stable"

on:
  schedule:
# Build Every Week
    - cron: "0 0 * * 0"
  push:
    branches: [ 'main' ]
    paths:
      - ".github/workflows/devuan.yml"
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Needed Dependencies
        run: |
          curl -L -o /tmp/mmdebstrap.deb http://ftp.us.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_1.5.7-3_all.deb
          sudo apt install -yq /tmp/mmdebstrap.deb
          curl -L -o /tmp/keyring.deb http://ftp.us.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          sudo apt install -yq /tmp/keyring.deb
      - name: Start Building
        run: |
          dist_version="excalibur"
          sudo mmdebstrap \
          --arch=arm64 \
          --variant=minbase \
          --components="main,contrib,non-free" \
          --include=ca-certificates,locales \
          --format=tar \
          ${dist_version} \
          - \
          "deb http://deb.devuan.org/merged ${dist_version} main contrib non-free" \
          "deb http://deb.devuan.org/merged ${dist_version}-updates main contrib non-free" \
          "deb http://deb.devuan.org/merged ${dist_version}-security main contrib non-free"
          | xz -9 -T0 -c > tmprootfs.tar.xz
          mkdir $GITHUB_WORKSPACE/devuan
          tar  --exclude=dev/* -xJf tmprootfs.tar.xz -C devuan
          sudo tar -cf - devuan | xz -9 -T0 -c > devuan-stable-aarch64.tar.xz
          sudo rm -r devuan

      - name: Build XFCE
        run: |
          tar -xJf devuan-stable-aarch64.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/dev
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/proc
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/sys
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/devuan
          sudo chmod -R 1777 $GITHUB_WORKSPACE/devuan/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/devuan/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/devuan/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/devuan/sys
          sudo chroot $GITHUB_WORKSPACE/devuan /bin/sh -c "apt update && apt install wget -y && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/devuan/xfce/install.sh && sh install.sh && rm install.sh"
          sudo umount -l $GITHUB_WORKSPACE/devuan/dev
          sudo umount -l $GITHUB_WORKSPACE/devuan/proc
          sudo umount -l $GITHUB_WORKSPACE/devuan/sys
          sudo tar --exclude=dev/* -cf - devuan | xz -9 -T0 -c > devuan-stable-xfce-aarch64.tar.xz
          sudo rm -r devuan

      - name: Build MATE
        run: |
          tar -xJf devuan-stable-aarch64.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/dev
          sudo mkdir -p $GITHUB_WORKSPACE/ubu5ntu/proc
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/sys
          sudo mkdir -p $GITHUB_WORKSPACE/devuan/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/devuan
          sudo chmod -R 1777 $GITHUB_WORKSPACE/devuan/tmp
          sudo mount --bind /dev $GITHUB_WORKSPACE/devuan/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/devuan/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/devuan/sys
          sudo chroot $GITHUB_WORKSPACE/devuan /bin/sh -c "apt update && apt install wget -y && wget https://raw.githubusercontent.com/arfshl/proot-distro-desktop/refs/heads/main/devuan/mate/install.sh && sh install.sh && rm install.sh"
          sudo umount -l $GITHUB_WORKSPACE/devuan/dev
          sudo umount -l $GITHUB_WORKSPACE/devuan/proc
          sudo umount -l $GITHUB_WORKSPACE/devuan/sys
          sudo tar --exclude=dev/* -cf - devuan | xz -9 -T0 -c > devuan-stable-mate-aarch64.tar.xz
          sudo rm -r devuan
          
