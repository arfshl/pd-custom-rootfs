          sudo umount -l $GITHUB_WORKSPACE/devuan/sys
          sudo tar --exclude=dev/* -cf - devuan | xz -9 -T0 -c > devuan-stable-lxqt-aarch64.tar.xz
          sudo rm -r devuan
          
      - name: Build LXDE
