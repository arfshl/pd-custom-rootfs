name: "Arch Linux"

on:
  schedule:
# Build Every Week
    - cron: "0 0 * * 0"
  push:
    branches: [ 'main' ]
    paths:
      - ".github/workflows/archlinux.yml"
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build-arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        arch: [aarch64, arm]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Start Build!
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt update
          sudo apt install -y libc6:armhf
          ARCH=${{ matrix.arch }}
          case "$ARCH" in
          arm)
          ARCH="armv7"
          ;;
          aarch64)
          ARCH="aarch64"
          ;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/archlinux-dump/"
          WORKDIR="$GITHUB_WORKSPACE/archlinux-dump"
          curl --fail --location \
          --output "${WORKDIR}/archlinux-${{ matrix.arch }}.tar.gz" \
          "http://os.archlinuxarm.org/os/ArchLinuxARM-$ARCH-latest.tar.gz"
          
          sudo mkdir -m 755 "${WORKDIR}/archlinux"
          sudo tar -zxvp \
          -f "${WORKDIR}/archlinux-${{ matrix.arch }}.tar.gz" \
          -C "${WORKDIR}/archlinux"

          cat <<- EOF | sudo unshare -mpf bash -e -
          rm -f "${WORKDIR}/archlinux/etc/resolv.conf"
          echo "nameserver 1.1.1.1" > "${WORKDIR}/archlinux/etc/resolv.conf"
          sed -i 's/^#DisableSandbox/DisableSandbox/' "${WORKDIR}/archlinux/etc/pacman.conf"
          mount --bind "${WORKDIR}/archlinux" "${WORKDIR}/archlinux"
          mount --bind /dev "${WORKDIR}/archlinux/dev"
          mount --bind /proc "${WORKDIR}/archlinux/proc"
          mount --bind /sys "${WORKDIR}/archlinux/sys"
          #chroot "${WORKDIR}/archlinux" useradd -r -s /usr/bin/nologin -d /var/lib/pacman alpm
          chroot "${WORKDIR}/archlinux" pacman-key --init
          chroot "${WORKDIR}/archlinux" pacman-key --populate archlinuxarm
          chroot "${WORKDIR}/archlinux" pacman -Rnsc --noconfirm linux-${{ matrix.arch }} linux-firmware
          chroot "${WORKDIR}/archlinux" pacman -Syu --noconfirm
          chroot "${WORKDIR}/archlinux" rm -f /var/cache/pacman/pkg/*
          sed -i 's/#DisableSandbox/DisableSandbox/' "${WORKDIR}/archlinux/etc/pacman.conf"
          EOF
          
          cd $GITHUB_WORKSPACE/archlinux-dump
          sudo tar --exclude=dev/* -cpf - archlinux | xz -9 -T0 -c > $GITHUB_WORKSPACE/archlinux-${{ matrix.arch }}.tar.xz
          sudo rm -r $GITHUB_WORKSPACE/archlinux-dump

      - name: Build XFCE
        run: |
          tar -xJpf archlinux-${{ matrix.arch }}.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/dev
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/proc
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/sys
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/archlinux
          sudo chmod -R 1777 $GITHUB_WORKSPACE/archlinux/tmp
          sudo mount --bind $GITHUB_WORKSPACE/archlinux $GITHUB_WORKSPACE/archlinux
          sudo mount --bind /dev $GITHUB_WORKSPACE/archlinux/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/archlinux/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/archlinux/sys
          sudo chroot $GITHUB_WORKSPACE/archlinux /bin/sh -c "pacman -Syu && pacman -S --noconfirm wget && wget https://github.com/arfshl/proot-distro-desktop/raw/refs/heads/main/arch/xfce/install.sh && sh install.sh && rm install.sh"
          sudo umount -R $GITHUB_WORKSPACE/archlinux
          
          sudo tar --exclude=dev/* -cpf - archlinux | xz -9 -T0 -c > archlinux-xfce-${{ matrix.arch }}.tar.xz
          sudo rm -r archlinux
          
      - name: Build lxqt
        run: |
          tar -xJpf archlinux-${{ matrix.arch }}.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/dev
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/proc
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/sys
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/archlinux
          sudo chmod -R 1777 $GITHUB_WORKSPACE/archlinux/tmp
          sudo mount --bind $GITHUB_WORKSPACE/archlinux $GITHUB_WORKSPACE/archlinux
          sudo mount --bind /dev $GITHUB_WORKSPACE/archlinux/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/archlinux/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/archlinux/sys
          sudo chroot $GITHUB_WORKSPACE/archlinux /bin/sh -c "pacman -Syu && pacman -S --noconfirm wget && wget https://github.com/arfshl/proot-distro-desktop/raw/refs/heads/main/arch/lxqt/install.sh && sh install.sh && rm install.sh"
          sudo umount -R $GITHUB_WORKSPACE/archlinux/
         
          sudo tar --exclude=dev/* -cpf - archlinux | xz -9 -T0 -c > archlinux-lxqt-${{ matrix.arch }}.tar.xz
          sudo rm -r archlinux
          
      - name: Build mate
        run: |
