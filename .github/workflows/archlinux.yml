          sudo mount --bind /sys $GITHUB_WORKSPACE/archlinux/sys
          sudo chroot $GITHUB_WORKSPACE/archlinux /bin/sh -c "pacman -Syu && pacman -S --noconfirm wget && wget https://github.com/arfshl/proot-distro-desktop/raw/refs/heads/main/arch/cinnamon/install.sh && sh install.sh && rm install.sh"
