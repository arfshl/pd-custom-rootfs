      - name: Push to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: archlinux
          name: Arch Linux (Rolling Release)
          files: |
            archlinux-${{ matrix.arch }}.tar.xz
            archlinux-*-${{ matrix.arch }}.tar.xz
          preserve_order: true
          make_latest: true

  build-amd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ x86_64 ]
        release: [ 2026.02.01 ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Start Build!
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archlinux-dump/"
          WORKDIR="$GITHUB_WORKSPACE/archlinux-dump"
          curl --fail --location \
          --output "${WORKDIR}/archlinux-${{ matrix.arch }}.tar.zst" \
          "https://mirror.rackspace.com/archlinux/iso/${dist_version}/archlinux-bootstrap-${dist_version}-${{ matrix.arch }}.tar.zst"

          sudo mkdir -m 755 "${WORKDIR}/archlinux-bootstrap"
          sudo tar -xp --strip-components=1 --acls --xattrs --xattrs-include='*' \
          -f "${WORKDIR}/archlinux-${{ matrix.arch }}.tar.zst" \
          -C "${WORKDIR}/archlinux-bootstrap"

          cat <<- EOF | sudo unshare -mpf bash -e -
          rm -f "${WORKDIR}/archlinux-bootstrap/etc/resolv.conf"
          echo "nameserver 1.1.1.1" > "${WORKDIR}/archlinux-bootstrap/etc/resolv.conf"
          mount --bind "${WORKDIR}/archlinux-bootstrap/" "${WORKDIR}/archlinux-bootstrap/"
          mount --bind /dev "${WORKDIR}/archlinux-bootstrap/dev"
          mount --bind /proc "${WORKDIR}/archlinux-bootstrap/proc"
          mount --bind /sys "${WORKDIR}/archlinux-bootstrap/sys"
          mkdir "${WORKDIR}/archlinux-bootstrap/archlinux-${{ matrix.arch }}"
          echo 'Server = http://mirror.rackspace.com/archlinux/\$repo/os/\$arch' > \
          "${WORKDIR}/archlinux-bootstrap/etc/pacman.d/mirrorlist"
          sed -i 's/^#DisableSandbox/DisableSandbox/' \
          "${WORKDIR}/archlinux-bootstrap/etc/pacman.conf"
          chroot "${WORKDIR}/archlinux-bootstrap" pacman-key --init
          chroot "${WORKDIR}/archlinux-bootstrap" pacman-key --populate
          chroot "${WORKDIR}/archlinux-bootstrap" pacstrap -K /archlinux-${{ matrix.arch }} base
          # chroot "${WORKDIR}/archlinux-bootstrap" pacman -Scc --noconfirm
          EOF

          sudo mv $GITHUB_WORKSPACE/archlinux-dump/archlinux-bootstrap $GITHUB_WORKSPACE/archlinux-dump/archlinux
          sudo rm -rf "${WORKDIR:?}/archlinux"/var/cache/pacman/pkg
          sudo sed -i 's/#DisableSandbox/DisableSandbox/' "${WORKDIR}/archlinux/etc/pacman.conf"
          cd $GITHUB_WORKSPACE/archlinux-dump
          sudo tar --exclude=dev/* -cpf - archlinux | xz -9 -T0 -c > $GITHUB_WORKSPACE/archlinux-${{ matrix.arch }}.tar.xz
          sudo rm -r $GITHUB_WORKSPACE/archlinux-dump

