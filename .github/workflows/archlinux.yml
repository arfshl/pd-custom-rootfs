          sudo chmod -R 755 $GITHUB_WORKSPACE/archlinux
          sudo chmod -R 1777 $GITHUB_WORKSPACE/archlinux/tmp
          sudo mount --bind $GITHUB_WORKSPACE/archlinux $GITHUB_WORKSPACE/archlinux
          sudo mount --bind /dev $GITHUB_WORKSPACE/archlinux/dev
          sudo mount --bind /proc $GITHUB_WORKSPACE/archlinux/proc
          sudo mount --bind /sys $GITHUB_WORKSPACE/archlinux/sys
          sudo chroot $GITHUB_WORKSPACE/archlinux /bin/sh -c "pacman -Syu && pacman -S --noconfirm wget && wget https://github.com/arfshl/proot-distro-desktop/raw/refs/heads/main/arch/xfce/install.sh && sh install.sh && rm install.sh"
          sudo umount -R $GITHUB_WORKSPACE/archlinux
          
          sudo tar --exclude=dev/* -cpf - archlinux | xz -9 -T0 -c > archlinux-xfce-${{ matrix.arch }}.tar.xz
          sudo rm -r archlinux
          
      - name: Build lxqt
