          sudo rm -r archlinux
          
      - name: Build cinnamon
        run: |
          tar -xJpf archlinux-${{ matrix.arch }}.tar.xz
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/dev
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/proc
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/sys
          sudo mkdir -p $GITHUB_WORKSPACE/archlinux/tmp
          sudo chmod -R 755 $GITHUB_WORKSPACE/archlinux
          sudo chmod -R 1777 $GITHUB_WORKSPACE/archlinux/tmp
